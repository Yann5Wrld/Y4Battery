name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # ubuntu-24.04 contient déjà le SDK Android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"

      - name: Compiler l'APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v5
        with:
          name: Y4Battery-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publier l'APK (lien direct)
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Y4Battery.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest Y4Battery.apk --title "Y4 Battery" --notes "APK de la dernière version" --latest
        env:
          GH_TOKEN: ${{ github.token }}
